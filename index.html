<style>
/* مودال قفل شطرنجی */

  background: rgba(0,0,0,0.85);

  padding: 20px;
  opacity: 0; pointer-events: none;

}

  opacity: 1; pointer-events: auto;
}
.chess-lock-box {

}

}
.chess-cell {

  display: flex; align-items: center; justify-content: center;

}
.chess-cell.light { background: #f0d9b5; }

}

  color: #ff6b6b; font-weight: 600;
}
.chess-lock-msg.success { color: #39ff14; }
.chess-lock-close {
  display: block; width: 100%; padding: 10px;

/* کنسول اطلاعات بازدیدکننده (پس از باز شدن قفل) */
.visitor-panel {
  position: fixed; inset: 0; z-index: 99998;

}

    </div>
  </div>

<script>
/* ============================================ */
/* 🔐 VISITOR TRACKING SYSTEM                   */
/* ============================================ */
(function() {
  const STORAGE_KEY = 'visitor_log_v1';
  const MAX_ENTRIES = 200;

  // شناسه یکتای بازدیدکننده
  function getVisitorId() {
    let vid = localStorage.getItem('visitor_id');
    if (!vid) {
      vid = 'v_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('visitor_id', vid);
    }
    return vid;
  }

  // تشخیص نوع دستگاه و مرورگر
  function detectDevice() {
    const ua = navigator.userAgent;
    const uaData = navigator.userAgentData || {};
    let deviceType = 'Desktop';
    if (/Mobi|Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(ua)) {
      deviceType = /iPad|Tablet/i.test(ua) ? 'Tablet' : 'Mobile';
    }
    let os = 'Unknown';
    if (/Windows NT 10/i.test(ua)) os = 'Windows 10/11';
    else if (/Windows NT 6\.3/i.test(ua)) os = 'Windows 8.1';
    else if (/Windows NT 6\.1/i.test(ua)) os = 'Windows 7';
    else if (/Mac OS X/i.test(ua)) {
      const m = ua.match(/Mac OS X (\d+[._]\d+[._]?\d*)/);
      os = 'macOS' + (m ? ' ' + m[1].replace(/_/g, '.') : '');
    }
    else if (/Android/i.test(ua)) {
      const m = ua.match(/Android (\d+(\.\d+)?)/);
      os = 'Android' + (m ? ' ' + m[1] : '');
    }
    else if (/iPhone|iPad|iPod/i.test(ua)) {
      const m = ua.match(/OS (\d+[._]\d+)/);
      os = 'iOS' + (m ? ' ' + m[1].replace(/_/g, '.') : '');
    }
    else if (/Linux/i.test(ua)) os = 'Linux';
    else if (/CrOS/i.test(ua)) os = 'ChromeOS';

    // مدل گوشی
    let phoneModel = '—';
    const phoneMatches = ua.match(/\(([^)]+)\)/g);
    if (phoneMatches) {
      for (const p of phoneMatches) {
        const inner = p.slice(1, -1);
        // الگوهای رایج مدل گوشی
        const modelMatch = inner.match(/(SM-[A-Z0-9]+|Pixel \d+[a-zA-Z ]*|iPhone\d+[,;\d]*|Redmi [A-Z0-9 ]+|M20\d+|CPH\d+|V\d{4}|RNE-L\d+|ONEPLUS [A-Z0-9]+|Mi \d+[A-Z ]*|POCO [A-Z0-9 ]+)/i);
        if (modelMatch) { phoneModel = modelMatch[0]; break; }
      }
      // iPhone از UA
      if (/iPhone/i.test(ua)) {
        const im = ua.match(/iPhone OS (\d+_\d+)/);
        if (im) phoneModel = 'iPhone (iOS ' + im[1].replace('_', '.') + ')';
      }
    }

    // مرورگر
    let browser = 'Unknown';
    if (/Edg\//.test(ua)) navig browser = 'Edge';
    else if (/OPR\//.test(ua) || /Opera/.test(ua)) browser = 'atorOpera';
    else if (/Chrome\//.test(ua) && !/Edg|OPR/.test(ua)) browser.pl = 'Chrome';
    else if (/Safari\//.test(ua) && !/Chrome/.test(ua)) browseratform = 'Safari';
    else if (/Firefox\//.test(ua)) browser = 'Firefox';

    return {
      || deviceType, os, phoneModel, browser,
      screen: `${screen.width}x${screen.height}`,
      language: navigator.language || '—',
      platform: uaData.platform || '—',
      mobile: uaData.mobile !== undefined ? uaData.mobile : /Mobi|Android|iPhone/i.test(ua)
    };
  }

  // گرفتن IP از APIهای عمومی
  async function getIPInfo() {
    const endpoints = [
      'https://ipapi.co/json/',
      'https://ipwho.is/',
      'https://api.ipify.org?format=json'
    ];
    for (const url of endpoints) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 4000);
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) continue;
        const data = await res.json();
        return {
          ip: data.ip || data.query || '—',
          country: data.country_name || data.country || '—',
          countryCode: data.country_code || data.countryCode || '—',
          city: data.city || '—',
          region: data.region || data.region_name || '—',
          isp: data.org || data.isp || data.connection?.isp || '—',
          timezone: data.timezone || data.time_zone || '—',
          lat: data.latitude || data.lat || '—',
          lon: data.longitude || data.lon || '—'
        };
      } catch(e) { /* ادامه */ }
    }
    return { ip: 'نامشخص', country: '—', city: '—', isp: '—' };
  }

  // ذخیره بازدید
  async function trackVisit() {
    const info = await getIPInfo();
    const dev = detectDevice();
    const entry = {
      id: getVisitorId(),
      timestamp: new Date().toISOString(),
      localTime: new Date().toLocaleString('fa-IR'),
      ip: info.ip,
      country: info.country,
      countryCode: info.countryCode || '—',
      city: info.city,
      region: info.region || '—',
      isp: info.isp,
      timezone: info.timezone || '—',
      lat: info.lat || '—',
      lon: info.lon || '—',
      deviceType: dev.deviceType,
      os: dev.os,
      phoneModel: dev.phoneModel,
      browser: dev.browser,
      screen: dev.screen,
      language: dev.language,
      platform: dev.platform,
      userAgent: navigator.userAgent,
      referrer: document.referrer || 'direct',
      page: location.pathname
    };

    // ذخیره در localStorage
    let logs = [];
    try { logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}
    logs.unshift(entry);
    if (logs.length > MAX_ENTRIES) logs = logs.slice(0, MAX_ENTRIES);
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(logs)); } catch(e) {}

    // ارسال به سرور (اختیاری - اگر بک‌اند دارید این رو فعال کنید)
    // try {
    //   await fetch('https://your-server.com/api/track', {
    //     method: 'POST',
    //     headers: { 'Content-Type': 'application/json' },
    //     body: JSON.stringify(entry)
    //   });
    // } catch(e) {}

    console.log('✅ Visitor tracked:', entry);
    return entry;
  }

  // نمایش لیست
  window.openVisitorPanel = function() {
    const panel = document.getElementById('visitorPanel');
    const list = document.getElementById('visitorList');
    let logs = [];
    try { logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch(e) {}

    if (!logs.length) {
      list.innerHTML = '<div class="empty-state">هنوز بازدیدکننده‌ای ثبت نشده است</div>';
    } else {
      list.innerHTML = logs.map((e, i) => `
        <div style="border:1px solid rgba(0,255,0,0.15);border-radius:8px;padding:10px;margin-bottom:10px;">
          <div style="color:#39ff14;font-weight:700;margin-bottom:6px;">#${i+1} — ${e.localTime}</div>
          <div class="visitor-row"><span class="key">IP:</span><span class="val">${e.ip}</span></div>
          <div class="visitor-row"><span class="key">کشور:</span><span class="val">${e.country} ${e.city !== '—' ? ' / ' + e.city : ''}</span></div>
          <div class="visitor-row"><span class="key">ISP:</span><span class="val">${e.isp}</span></div>
          <div class="visitor-row"><span class="key">دستگاه:</span><span class="val">${e.deviceType}</span></div>
          <div class="visitor-row"><span class="key">سیستم:</span><span class="val">${e.os}</span></div>
          <div class="visitor-row"><span class="key">مدل گوشی:</span><span class="val">${e.phoneModel}</span></div>
          <div class="visitor-row"><span class="key">مرورگر:</span><span class="val">${e.browser}</span></div>
          <div class="visitor-row"><span class="key">صفحه:</span><span class="val">${e.screen}</span></div>
          <div class="visitor-row"><span class="key">زبان:</span><span class="val">${e.language}</span></div>
        </div>
      `).join('');
    }
    panel.classList.add('open');
  };

  window.closeVisitorPanel = function() {
    document.getElementById('visitorPanel').classList.remove('open');
  };

  window.exportVisitorLog = function() {
    const logs = localStorage.getItem(STORAGE_KEY) || '[]';
    const blob = new Blob([logs], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'visitors_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  window.clearVisitorLog = function() {
    if (confirm('همه لاگ‌ها پاک شوند؟')) {
      localStorage.removeItem(STORAGE_KEY);
      openVisitorPanel();
    }
  };

  // اجرای ردیابی
  trackVisit();
})();

/* ============================================ */
/* ♟️ CHESS LOCK SYSTEM                        */
/* ============================================ */
(function() {
  const boardEl = document.getElementById('chessBoard');
  const msgEl = document.getElementById('chessLockMsg');
  const modal = document.getElementById('chessLockModal');
  if (!boardEl) return;

  // چیدمان اولیه شطرنج (حروف یونیکد شطرنج)
  // K=King, Q=Queen, R=Rook, B=Bishop, N=Knight, P=Pawn
  // 'w'=سفید, 'b'=سیاه
  const initialBoard = [
    ['bR','bN','bB','bQ','bK','bB','bN','bR'],
    ['bP','bP','bP','bP','bP','bP','bP','bP'],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ['wP','wP','wP','wP','wP','wP','wP','wP'],
    ['wR','wN','wB','wQ','wK','wB','wN','wR']
  ];

  const pieceUnicode = {
    'wK':'♔','wQ':'♕','wR':'♖','wB':'♗','wN':'♘','wP':'♙',
    'bK':'♚','bQ':'♛','bR':'♜','bB':'♝','bN':'♞','bP':'♟'
  };

  let board = initialBoard.map(r => r.slice());
  let selected = null; // {r, c}
  let solved = false;

  // بررسی حرکت معتبر (ساده شده - فقط حرکات پایه)
  function isValidMove(fromR, fromC, toR, toC) {
    if (fromR === toR && fromC === toC) return false;
    const piece = board[fromR][fromC];
    if (!piece) return false;
    const target = board[toR][toC];
    if (target && target[0] === piece[0]) return false; // همان رنگ

    const dr = toR - fromR;
    const dc = toC - fromC;
    const absDr = Math.abs(dr);
    const absDc = Math.abs(dc);
    const color = piece[0];
    const type = piece[1];

    // بررسی مسیر خالی برای مهره‌های دوربرد
    function pathClear() {
      const stepR = Math.sign(dr);
      const stepC = Math.sign(dc);
      let r = fromR + stepR, c = fromC + stepC;
      while (r !== toR || c !== toC) {
        if (board[r][c]) return false;
        r += stepR; c += stepC;
      }
      return true;
    }

    switch(type) {
      case 'P': { // سرباز
        const dir = color === 'w' ? -1 : 1;
        const startRow = color === 'w' ? 6 : 1;
        if (dc === 0 && dr === dir && !target) return true;
        if (dc === 0 && dr === 2*dir && fromR === startRow && !target && !board[fromR+dir][fromC]) return true;
        if (absDc === 1 && dr === dir && target && target[0] !== color) return true;
        return false;
      }
      case 'N': // اسب
        return (absDr === 2 && absDc === 1) || (absDr === 1 && absDc === 2);
      case 'B': // فیل
        return absDr === absDc && pathClear();
      case 'R': // رخ
        return (dr === 0 || dc === 0) && pathClear();
      case 'Q': // ملکه
        return ((dr === 0 || dc === 0) || (absDr === absDc)) && pathClear();
      case 'K': // شاه
        return absDr <= 1 && absDc <= 1;
    }
    return false;
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const cell = document.createElement('div');
        cell.className = 'chess-cell ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
        cell.dataset.r = r;
        cell.dataset.c = c;
        if (selected && selected.r === r && selected.c === c) {
          cell.classList.add('selected');
        }
        const p = board[r][c];
        if (p) {
          const span = document.createElement('span');
          span.className = 'piece';
          span.textContent = pieceUnicode[p];
          span.style.color = p[0] === 'w' ? '#fff' : '#000';
          span.style.textShadow = p[0] === 'w'
            ? '0 0 2px #000, 0 1px 1px rgba(0,0,0,0.5)'
            : '0 0 2px #fff, 0 1px 1px rgba(255,255,255,0.3)';
          cell.appendChild(span);
        }
        cell.addEventListener('click', () => onCellClick(r, c));
        boardEl.appendChild(cell);
      }
    }
  }

  function onCellClick(r, c) {
    if (solved) return;
    msgEl.textContent = '';
    msgEl.classList.remove('success');

    if (!selected) {
      // انتخاب مهره سفید
      if (board[r][c] && board[r][c][0] === 'w') {
        selected = { r, c };
        render();
      } else {
        msgEl.textContent = '❌ فقط مهره‌های سفید را می‌توانید حرکت دهید';
      }
    } else {
      // تلاش برای حرکت
      if (selected.r === r && selected.c === c) {
        selected = null;
        render();
        return;
      }
      if (isValidMove(selected.r, selected.c, r, c)) {
        // انجام حرکت
        board[r][c] = board[selected.r][selected.c];
        board[selected.r][selected.c] = null;
        selected = null;
        render();
        // حرکت معتبر → باز شدن قفل
        solved = true;
        msgEl.textContent = '✅ حرکت معتبر! قفل باز شد...';
        msgEl.classList.add('success');
        setTimeout(() => {
          closeChessLock();
          openVisitorPanel();
          try { sessionStorage.setItem('chessUnlocked', '1'); } catch(e) {}
        }, 700);
      } else {
        msgEl.textContent = '❌ حرکت نامعتبر است — دوباره امتحان کنید';
        selected = null;
        render();
      }
    }
  }

  window.openChessLock = function() {
    try {
      if (sessionStorage.getItem('chessUnlocked') === '1') {
        openVisitorPanel();
        return;
      }
    } catch(e) {}
    board = initialBoard.map(r => r.slice());
    selected = null;
    solved = false;
    msgEl.textContent = '';
    msgEl.classList.remove('success');
    render();
    modal.classList.add('open');
  };

  window.closeChessLock = function() {
    modal.classList.remove('open');
  };

  // کلیک بیرون مودال → بستن
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeChessLock();
  });

  // دکمه مخفی: سه بار کلیک روی لوگو → باز کردن قفل
  let logoClicks = 0, logoTimer = null;
  const logo = document.querySelector('.logo');
  if (logo) {
    logo.style.cursor = 'pointer';
    logo.addEventListener('click', () => {
      logoClicks++;
      clearTimeout(logoTimer);
      logoTimer = setTimeout(() => { logoClicks = 0; }, 800);
      if (logoClicks >= 3) {
        logoClicks = 0;
        openChessLock();
      }
    });
  }

  // میانبر کیبورد: Ctrl+Shift+V
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'v') {
      e.preventDefault();
      openChessLock();
    }
  });

  render();
})();
</script>
